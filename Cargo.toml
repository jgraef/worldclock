[package]
name = "worldclock"
version = "0.2.1"
authors = ["Janosch Gräf <janosch.graef@gmail.com>"]
edition = "2021"
description = "A command-line world clock."
repository = "https://github.com/jgraef/worldclock"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
dirs = "5.0"
color-eyre = "0.6"
prettytable-rs = "0.10"
clap = { version = "4.6", features = ["derive"] }
